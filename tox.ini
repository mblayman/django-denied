[tox]
isolated_build = True
envlist =
    py311-django{42,50,51,52}
    py312-django{42,50,51,52,60,61}
    py313-django{51,52,60,61}
    py314-django{52,60,61}
    py315-django61

[testenv]
commands =
  python \
    -W error::ResourceWarning \
    -W error::DeprecationWarning \
    -W error::PendingDeprecationWarning \
    -m coverage run \
    -m pytest {posargs:tests}
deps = -r requirements/{envname}.txt
setenv =
    PYTHONDEVMODE=1
